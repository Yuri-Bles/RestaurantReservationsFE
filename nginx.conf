server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /apiv1/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8081;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
